name: Test and publish ARTIVO
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backend tests
        run: python3 -m unittest discover -s tests -v
      - name: Build public preview
        run: python3 scripts/build_site.py
      - name: JavaScript and demo tests
        run: |
          for source in web/*.js; do node --check "$source"; done
          node --check web/app.js
          node --check web/feed.js
          node --check web/demo.js
          node --check web/arti-domain.js
          node --check web/arti-ui.js
          node --test tests/test_*.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
